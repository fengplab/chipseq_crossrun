# Descriptions used by bin/build_report.py. Keys are figure file prefixes; a prefix may cover several
# files (e.g. one per feature set or per time-course series), which become sub-figures a, b, c ...
# Per-run details (how many items are shown and how they were chosen) come from figures/figure_notes.tsv.

sections:
  - title: "Sample overview: peaks and read distribution"
    figures: [pk01, pk02, pk03, pk04, pk05]
  - title: "Motif content (Q1)"
    figures: [fig01, fig02, fig03]
  - title: "Repeats, centromeres and satellites (Q2)"
    figures: [fig04, fig05, fig06, fig07]
  - title: "Similarity to known DNA-binding-protein motifs (Q3)"
    figures: [fig08, fig09]
  - title: "Recurrent regions and overlap between samples (Q4)"
    figures: [fig10, fig11, fig12, fig13]
  - title: "Relationships with sample metadata (Q5)"
    figures: [fig16]
  - title: "Quality control: mappability and fragment sizes"
    figures: [qc01, qc02, qc04, qc05, qc06]
  - title: "Binding models: motif effects on binding across the genome"
    figures: [mod01, mod02, mod03, mod04, mod05, mod06, mod07]

figures:
  pk01:
    title: "Peaks per sample"
    meaning: >
      How many peaks each sample has and how much of the genome they cover. Large differences between samples
      of the same condition usually reflect sequencing depth, antibody efficiency or peak-calling thresholds
      rather than biology, and they affect every later comparison that uses percentages of peaks.
    axes:
      - "y-axis: samples, grouped by the categorical covariates in the config."
      - "Left panel, x-axis: number of peaks (value printed at the end of each bar)."
      - "Right panel, x-axis: total base pairs covered by the sample's peaks, in megabases."
      - "Bar colour: the grouping variable (config: upset_group_var)."
    abbreviations:
      Mb: "megabases (1,000,000 bp)"

  pk02:
    title: "Peaks per chromosome"
    meaning: >
      Where each sample's peaks lie across chromosomes. The number in each tile is the peak count; the colour
      compares the chromosome's share of the sample's peaks with its share of the genome, so long chromosomes
      do not dominate. Red chromosomes carry more peaks than their length predicts (for example satellite-rich
      chromosomes 1, 9 and 16, or the acrocentric short arms), blue fewer. A sample with peaks on chrY but no Y
      chromosome, or a sample whose peaks pile onto one chromosome, deserves a closer look.
    axes:
      - "x-axis: every chromosome of the genome, in genome order (including chromosomes without peaks)."
      - "y-axis: samples, in the same order as Figure P1."
      - "Number in each tile: number of peaks (blank = none)."
      - "Colour: log2(share of the sample's peaks on the chromosome / share of the genome the chromosome occupies); 0 (white) = as expected from length, +1 = twice as many, -1 = half; grey = no peaks."
    abbreviations:
      acrocentric: "chromosomes 13, 14, 15, 21 and 22, whose short arms carry rDNA and satellite arrays"

  pk03:
    title: "Peak width"
    meaning: >
      The distribution of peak widths in each sample. Narrow-peak calls are typically a few hundred base pairs;
      broad-peak calls and peaks over satellite arrays can be many kilobases. A sample whose widths differ from
      others of its kind may have been called with different settings or have a different fragment size.
    axes:
      - "y-axis: samples, in the same order as Figure P1."
      - "x-axis: peak width in base pairs (log scale)."
      - "Violin: distribution of widths; box: median and interquartile range; text: median width and number of peaks."
      - "Fill colour: the grouping variable (config: upset_group_var)."
    abbreviations:
      bp: "base pairs"

  pk04:
    title: "Fold enrichment of peaks"
    meaning: >
      The distribution of the peak caller's fold enrichment (ChIP signal over the control) in each sample: for
      MACS narrow peaks at the summit, for broad peaks over the region. Higher medians mean stronger peaks. Many
      peaks just above the dashed 2-fold line indicate a weak pull-down or a permissive threshold.
    axes:
      - "y-axis: samples, in the same order as Figure P1."
      - "x-axis: fold enrichment over control (column 7 of narrowPeak/broadPeak files), log2 scale."
      - "Violin: distribution; box: median and interquartile range; text: median and number of peaks with a value."
      - "Dashed line: 2-fold enrichment."
    abbreviations:
      FE: "fold enrichment"
      MACS: "Model-based Analysis of ChIP-seq (peak caller)"

  pk05:
    title: "Reads on viral genomes and mitochondrial DNA"
    meaning: >
      How much of each library aligned to the viral genomes (HSV-1, KSHV, adenovirus) and to host contigs left out
      of the peak analyses (chrM), compared with the host nuclear genome. When the pipeline wrote contig_reads.tsv,
      chrM and viral reads are its counts before host filtering (duplicates removed), and every share is of all reads
      in the library, unaligned included (total_reads_dedup); the host nuclear part is mapped reads minus duplicates
      minus the listed contigs. These are not the reads used for peak calling, which exclude chrM and viral sequences.
      With contigs.viral_mapq above 0, viral reads are counted only at or above that MAPQ, which removes reads that
      could belong to more than one genome (the two herpesviruses share conserved regions); host contigs are not
      filtered. Viral reads in a
      sample whose metadata names another virus, or no virus, point to cross-mapping, contamination or index hopping.
      Relative coverage corrects for genome length: a 150 kb virus holding 1% of the reads is covered about 200 times
      more deeply than the average host chromosome. The IP/control panel asks whether the cGAS pull-down enriches viral
      DNA beyond what is present in the input.
    axes:
      - "A, rows: samples, in the same order as Figure P1; the strip on the left shows the grouping variable (config: upset_group_var). Columns: host nuclear genome, each excluded host contig and each viral genome, for the IP and control libraries. Colour (log scale) and number: % of the library's counted reads."
      - "B, x-axis (log scale): mean depth on the contig divided by mean depth on the host nuclear genome (1, dashed = same depth). Filled points: IP; open points: control. Colour: contig."
      - "C, x-axis: log2(share of IP reads on the contig / share of control reads); 0 = as in the control, +1 = twice the share."
      - "D: all IP libraries and all control libraries pooled (reads summed): share of reads (log scale) and relative coverage per contig."
      - "E (pipeline contig_reads.tsv only): % of each viral genome and excluded contig covered by at least one read. Near 100% with few reads means reads spread over the whole genome; a low value means reads pile up in a few places (repeats or regions shared with the host)."
    abbreviations:
      MAPQ: "mapping quality; low values mean the read aligns about equally well elsewhere"
      chrM: "mitochondrial DNA"
      HSV-1: "herpes simplex virus 1 (NC_001806.2, strain 17)"
      KSHV: "Kaposi's sarcoma-associated herpesvirus / HHV-8 (NC_009333.1, strain GK18)"
      ADV: "human adenovirus 5 (AC_000008.1)"

  fig01:
    title: "Motif family prevalence across samples"
    meaning: >
      De novo motifs from every XSTREME run were clustered into cross-run motif families, and every sample's
      peaks were rescanned with each family. Each cell shows how common a family is in a sample. Families
      found in many samples with high prevalence are the recurrent sequence features of the ChIP'd DNA;
      rows enriched in only some samples point to condition-specific content.
    axes:
      - "Rows: for each sample, the 5 motif families most enriched in its peaks over the genomic background (fold enrichment, then % of peaks), combined over samples; clustered by similarity of their prevalence profiles."
      - "Columns: samples, clustered by similarity of their motif profiles."
      - "Colour: percentage of the sample's peaks containing at least one site of the family (white = 0%, dark blue = highest)."
      - "Colour bars above the columns: sample metadata (e.g. virus, cell type, time point, cGAS construct)."
    abbreviations:
      F###: "cross-run motif family identifier"
      IUPAC codes in consensus: "N = any base; R = A/G; Y = C/T; S = G/C; W = A/T; K = G/T; M = A/C"

  fig02:
    title: "Repeat-likeness of motif families"
    meaning: >
      Distinguishes motifs that behave like transcription-factor sites (usually about one site per peak)
      from motifs that come from tandem repeats (many evenly spaced sites per peak). Points high on the
      y-axis and coloured orange are motifs that sit mostly inside annotated repeats and occur many times
      per peak, which is the signature of satellite or simple-repeat DNA rather than a protein-recognition
      site. Only outliers are labelled.
    axes:
      - "x-axis: median, across samples, of the percentage of peaks containing the motif."
      - "y-axis (log scale): mean number of motif sites per peak, among peaks that contain at least one site."
      - "Colour: percentage of the motif's sites that fall inside RepeatMasker or CenSat annotations (the larger of the two)."
      - "Shape: repeat-likeness class. 'repeat (tandem)': mostly in repeats and tandem evidence; 'repeat-embedded': mostly in repeats without tandem evidence; 'low-complexity / periodic': tandem or low-complexity evidence outside annotated repeats; 'TF-like': none of these."
      - "Labels: family IDs of outliers (beyond 1.5 x the interquartile range on either axis)."
    abbreviations:
      IQR: "interquartile range"
      TF: "transcription factor"

  fig03:
    title: "Spacing between neighbouring motif sites"
    meaning: >
      For each motif family, the distance between adjacent same-strand sites inside the same peak. Tandem
      repeats produce sharp peaks at the repeat period (for example 5 bp for (ATTCC)n human satellite 2/3,
      about 171 bp for alpha-satellite) and at multiples of it; isolated binding sites give a flat,
      scattered distribution.
    axes:
      - "Panels: motif families (ID and consensus), up to the top 20 ranked by strength of periodicity."
      - "x-axis: distance between the starts of adjacent same-strand sites (bp)."
      - "y-axis: number of site pairs at that distance, summed over all samples (independent scale per panel)."
    abbreviations:
      bp: "base pairs"

  fig04:
    title: "Peak enrichment in repeat and satellite classes"
    meaning: >
      Whether peaks fall in each class of repeat more or less often than expected by chance. The expected
      count comes from randomly relocating each sample's peaks many times within the regions where peaks
      can be called (same widths, same chromosome), and counting overlaps with the same rule used for the
      real peaks. Red cells mean more peaks than expected in that class; blue, fewer.
    axes:
      - "Rows: repeat classes (CenSat centromeric/satellite classes, or RepeatMasker class/family), clustered. For each sample, every class enriched or depleted at q < 0.05 is shown, or the 5 classes with the smallest p-values when fewer are significant; the figure shows the union over samples."
      - "Columns: samples, clustered."
      - "Colour: log2(observed / expected) peak count; 0 (white) = as expected, +1 = twice as many, -1 = half."
      - "Asterisk (*): enrichment or depletion significant at q < 0.05 (empirical p-value from the shuffles, BH-adjusted)."
      - "Colour bars above the columns: sample metadata."
    abbreviations:
      O/E: "observed / expected"
      q: "Benjamini-Hochberg false-discovery-rate adjusted p-value"
      BH: "Benjamini-Hochberg"
      HOR: "higher-order repeat (alpha-satellite monomers organised into multi-monomer repeat units)"
      HSat: "human satellite (HSat1A, HSat1B, HSat2, HSat3)"
      BSat / GSat: "beta-satellite / gamma-satellite"
      CenSat: "T2T centromere and satellite annotation"
      RepeatMasker class/family: "e.g. SINE/Alu (short interspersed element, Alu family), LINE/L1 (long interspersed element, L1), LTR/ERV (long terminal repeat retrotransposon), Satellite/centr (centromeric satellite), Simple_repeat (microsatellite)"

  fig05:
    title: "Share of peaks in centromeric and satellite classes"
    meaning: >
      The fraction of each sample's peaks that fall in each CenSat class. Unlike Figure 4 this is not
      corrected for how much of the genome each class occupies; it shows how much of each sample's peak set
      is centromeric or satellite DNA.
    axes:
      - "x-axis: samples."
      - "y-axis: percentage of the sample's peaks in each class (bars stacked)."
      - "Colours: CenSat classes; less common classes pooled as 'Other CenSat classes'."
    abbreviations:
      HOR: "higher-order repeat"
      HSat: "human satellite"

  fig06:
    title: "Centromeric and satellite peaks by chromosome (all samples combined)"
    meaning: >
      Where on the genome the centromeric/satellite peaks are, summed over all samples. Shows whether the
      signal is spread across all centromeres or concentrated in a few arrays (for example the large HSat2
      and HSat3 arrays on chromosomes 1, 9 and 16).
    axes:
      - "x-axis: every chromosome of the genome, in genome order (including chromosomes without CenSat peaks)."
      - "y-axis: CenSat class."
      - "Colour (log scale) and number in each tile: number of peaks, summed over all samples; grey tiles = 0."
    abbreviations:
      HOR: "higher-order repeat"
      HSat: "human satellite"

  fig07:
    title: "Read-level signal in repeat and satellite classes (IP versus control)"
    meaning: >
      Peak callers often miss broad enrichment over repetitive DNA. This figure measures it directly from
      reads: the fraction of each IP library's reads in a class divided by the same fraction in its matched
      control (input or IgG). Red means the IP is enriched in that class relative to its control.
    axes:
      - "Rows: repeat classes. The CenSat sub-figure shows every CenSat class; the RepeatMasker sub-figure shows classes with reads in at least one sample."
      - "Columns: IP samples. The CenSat sub-figure shows every sample."
      - "Rows and columns are clustered when every cell has a value; otherwise they are in fixed order (classes alphabetically, samples as in the manifest)."
      - "Colour: log2(IP read fraction / control read fraction); grey = no reads in the class or no control library."
      - "Colour bars above the columns: sample metadata."
    abbreviations:
      IP: "immunoprecipitation (ChIP sample)"
      IgG: "immunoglobulin G control"

  fig08:
    title: "Known motifs enriched in peaks"
    meaning: >
      Every sample's peaks were tested for enrichment of every motif in the known-motif databases (for
      example JASPAR, HOCOMOCO) with SEA, against composition-matched shuffled sequences. Large dark dots
      are strongly enriched known motifs. A black ring means a motif discovered de novo in that sample also
      resembles the known motif (Tomtom), so both lines of evidence agree. Motif similarity is not protein
      homology: a match means the peaks contain sequences resembling that protein's binding site.
    axes:
      - "Rows: known motifs (protein name and database ID), up to the top 20 ranked by number of samples with enrichment."
      - "Columns: samples, ordered by metadata."
      - "Dot size: -log10 SEA q-value (larger = more significant)."
      - "Dot colour: log2 enrichment ratio (fraction of peaks with the motif / fraction of control sequences)."
      - "Black ring: a de novo motif from that sample matches the known motif (Tomtom E-value below the threshold)."
    abbreviations:
      SEA: "Simple Enrichment Analysis (MEME Suite)"
      Tomtom: "MEME Suite motif-comparison tool"
      q: "BH-adjusted p-value"
      E-value: "expected number of matches this good by chance"

  fig09:
    title: "Known-motif evidence by transcription-factor class"
    meaning: >
      Redundant motifs (for example many ETS-family factors share GGAA) are grouped by structural TF class,
      or by TF name when no class table was supplied. For each group, the two bars count the samples with
      each kind of evidence: enrichment of the known motif (SEA) and similarity of a de novo motif to it
      (Tomtom). A zero-length bar means that kind of evidence was absent.
    axes:
      - "y-axis: TF class (or TF name), up to the top 20 ranked by SEA samples, then Tomtom samples."
      - "x-axis: number of samples."
      - "Blue bars: samples where at least one motif of the group is enriched (SEA q below threshold)."
      - "Orange bars: samples where a de novo motif matches a motif of the group (Tomtom)."
    abbreviations:
      TF: "transcription factor"
      SEA: "Simple Enrichment Analysis"

  fig10:
    title: "How many samples share each region"
    meaning: >
      All peaks from all samples were merged into regions. Most regions are found in one or a few samples;
      the tail on the right contains regions bound in most samples, which are either genuinely shared
      targets or recurrent artifacts (check the input-overlap column in the recurrent-regions table).
    axes:
      - "x-axis: number of samples with a peak in the merged region."
      - "y-axis (log scale): number of merged regions."

  fig11:
    title: "Pairwise similarity of peak sets"
    meaning: >
      Jaccard similarity between every pair of samples' peak sets, clustered. Samples that group together
      share binding locations; check whether clusters follow biology (virus, cell type, time) or
      something technical.
    axes:
      - "Rows and columns: samples, clustered by 1 - Jaccard similarity."
      - "Colour: Jaccard index (base pairs covered by both peak sets / base pairs covered by either); 0 = no overlap, 1 = identical."
      - "Diagonal: left blank (self-comparison)."
      - "Colour bars above the columns: sample metadata."

  fig12:
    title: "Regions shared between groups of samples"
    meaning: >
      An UpSet plot: an alternative to a Venn diagram that stays readable for many groups. Samples are
      pooled by the configured grouping variable (for example virus); a region belongs to a group if any
      sample in the group has a peak there.
    axes:
      - "Top bars: number of regions in each exact combination of groups (the combination is shown by the connected dots below)."
      - "Dot matrix: filled dots mark the groups in each combination."
      - "Left bars: total number of regions per group."
    abbreviations:
      UpSet: "set-intersection plot"

  fig13:
    title: "Genome-wide recurrence hotspots"
    meaning: >
      The genome is divided into fixed-size bins, and each bin is scored by how many samples have a peak in
      it. Clusters of red points mark hotspots bound in at least half of the samples, commonly
      pericentromeric satellites, rDNA-adjacent regions or highly expressed loci.
    axes:
      - "Panels: chromosomes."
      - "x-axis: position along the chromosome (Mb)."
      - "y-axis: number of samples with a peak in the bin."
      - "Colour: red = bin has peaks in at least half of the samples; grey = fewer."
    abbreviations:
      Mb: "megabases"
      kb: "kilobases"

  fig16:
    title: "Samples in combined feature space, with sample clusters"
    meaning: >
      A principal component analysis of all sample features together (scaled). Samples close together have
      similar motif, repeat, annotation and known-motif profiles. The first panel shows clusters of samples
      found by hierarchical clustering of the same features (not of the two plotted components), with the
      number of clusters chosen automatically as the one giving the best separation (highest average
      silhouette width). The remaining panels colour the same points by each covariate, so you can see
      whether clusters follow biology. The note gives how well clusters agree with each categorical covariate.
    axes:
      - "x-axis: principal component 1 (percentage of variance explained in the label)."
      - "y-axis: principal component 2."
      - "First panel: colour and shaded outline = cluster (C1, C2, ...); text = sample names (some hidden where they would overlap)."
      - "Other panels: colour (and shape, for categorical covariates) = the covariate named in the panel title."
    abbreviations:
      PCA / PC: "principal component analysis / principal component"
      Ward clustering: "hierarchical clustering that merges groups to minimise within-cluster variance"
      Silhouette width: "how much closer a sample is to its own cluster than to the nearest other cluster (-1 to 1; higher = better separated)"
      Cramer's V: "association between two categorical variables (0 = none, 1 = identical grouping)"
      PERMANOVA: "permutational multivariate analysis of variance"

  qc01:
    title: "Peak mappability versus peak score"
    meaning: >
      Per-base mappability measures how reliably fragments can be placed at a base: it is the fraction of the
      k-mers covering that base (k = the insert size, 150 bp by default) that occur only once in the genome on
      either strand. Low values mean repeated sequence where reads are discarded as multi-mapping or placed
      ambiguously. This figure asks whether peak strength depends on how mappable the peak region is, separately
      for each centromeric/satellite (CenSat) class and for peaks outside CenSat. A rising line means weak peaks
      sit in poorly mappable DNA, suggesting peak calling there is limited by mappability. Per-class slopes and
      q-values are in qc01c_mappability_score_by_censat.
    axes:
      - "Panels: CenSat class of the peak (by its midpoint), up to 12 classes with the most peaks, including 'Outside CenSat regions'."
      - "x-axis: peak score on a log2 scale (score type given in the axis label; set by qc.peak_score)."
      - "y-axis: mean per-base mappability over the peak (0 = no single-copy k-mers, 1 = fully unique)."
      - "Tile colour (log scale): number of peaks, all samples combined."
      - "Red line: least-squares linear trend within the panel, drawn only if it is significant (q < 0.05 after BH adjustment across classes)."
      - "Text in each panel: the slope (change in mappability per doubling of peak score) and its q-value, or 'too few peaks to test'."
    abbreviations:
      k-mer: "sequence of length k"
      CenSat: "T2T centromere and satellite annotation"

  qc02:
    title: "Peak mappability by CenSat class"
    meaning: >
      The distribution of peak mappability for each CenSat class (all samples combined), shown as violins.
      The red line marks the median per-base mappability of the whole class across the genome, i.e. what is
      typical for that kind of DNA regardless of peaks. Peaks whose distribution (and black median dot) sits
      above the red line come preferentially from the more mappable parts of the class, as expected when
      reads in the repetitive parts are discarded; peaks at or below it are being called in the poorly mappable
      sequence itself, where alignment artifacts are more likely. The model table (qc01_peak_mappability_models)
      gives each class's difference from peaks outside CenSat, adjusted for sample and peak score.
    axes:
      - "x-axis: CenSat class (ordered by number of peaks), including 'Outside CenSat regions'."
      - "y-axis: mean per-base mappability over each peak (0 = no single-copy k-mers, 1 = fully unique)."
      - "Violins: distribution of peak mappability (each violin scaled to the same width)."
      - "Black dot: median mappability of the class's peaks."
      - "Red line: median per-base mappability of all bases of the class genome-wide."
      - "n = number of peaks in the class."

  qc03:
    title: "Insert-size distributions by CenSat class, IP versus control"
    meaning: >
      One figure per IP sample. For each CenSat class, the distribution of fragment lengths (insert sizes) of
      properly paired fragments whose midpoint lies in the class, in the IP library and in its matched control
      library. Shorter IP fragments than control in a class can indicate protection of nucleosome-sized or
      smaller DNA; a shift seen equally in IP and control reflects the region (e.g. satellite structure or
      fragmentation bias) rather than the pull-down.
    axes:
      - "Panels: CenSat classes (most IP fragments first) plus fragments outside CenSat (a random subsample); fragment counts in the panel titles."
      - "x-axis: insert size in base pairs (10-bp bins; fragments longer than qc.insert_max excluded)."
      - "y-axis: fraction of the class's fragments in each bin (independent scale per panel)."
      - "Red: IP library; blue: control library."
    abbreviations:
      IP: "immunoprecipitation (ChIP sample)"
      Insert size: "length of the sequenced DNA fragment (outer distance between paired reads)"

  qc04:
    title: "Median insert-size shift between IP and control"
    meaning: >
      For each IP sample and CenSat class, the median IP fragment length minus the median fragment length of its
      control in the same class. The full distributions, one figure per sample, are in extra/insert_sizes/ (not part
      of this report). Consistent blue (IP shorter)
      or red (IP longer) across samples in a class points to a class-specific fragment-size signature of the
      pull-down.
    axes:
      - "x-axis: IP samples."
      - "y-axis: CenSat classes (and outside CenSat), ordered by number of IP fragments."
      - "Colour and number: median IP insert size minus median control insert size (bp); blank where either library has fewer than 50 fragments."

  qc05:
    title: "Strand balance and read stacking in peaks"
    meaning: >
      Tests whether peaks in repeats look like real ChIP enrichment. A genuine peak is built from many
      independent fragments on both strands, so its reads are roughly half on each strand and start at many
      different positions. Alignment artifacts in repeats tend to be strand-biased and stacked on a few start
      positions, where the few unique k-mers in an array let reads be placed. Each CenSat class is compared with
      peaks outside CenSat; tests and the share of peaks with significant strand bias are in
      qc05_peak_strand_stacking_by_censat. Only read 1 of each fragment is counted, so each fragment counts once.
    axes:
      - "x-axis: CenSat class (ordered by number of peaks), with the number of peaks shown; 'Outside CenSat regions' is the reference."
      - "Top panel, y-axis: strand imbalance, |share of reads on the forward strand - 0.5| x 2 (0 = balanced, 1 = all on one strand)."
      - "Middle panel, y-axis: start-site diversity, the number of distinct read start positions divided by the number expected if the same number of reads were placed at random in a peak of the same width (1 = as random; low values = stacked reads). Corrects for read count and peak width."
      - "Bottom panel, y-axis: share of the peak's reads that start at its single most-used position."
      - "Violins: distribution over peaks (all IP samples); black dot: median. Only peaks with at least qc.shape_min_reads reads are included."

  qc06:
    title: "Position of peak summits within CenSat arrays"
    meaning: >
      Mapping artifacts gather at the boundaries between unique and repetitive sequence, where reads that are
      only partly unique pile up. For every peak whose summit lies inside a CenSat array, this measures the
      distance to the nearest edge of that array and compares it with random positions in the same arrays. A
      red curve rising before the grey one means summits sit closer to array edges than chance (consistent with
      boundary artifacts, or with real binding at array borders such as transition regions); curves that
      overlap mean no edge preference.
    axes:
      - "Panels: CenSat classes with at least qc.edge_min_peaks summits (up to 12), with the number of peak summits."
      - "x-axis: distance from the summit to the nearest edge of its array, base pairs on a log scale."
      - "y-axis: cumulative fraction of summits (or random positions) at or below that distance."
      - "Red: peak summits (all samples; a region bound in several samples counts once per sample). Grey: random positions drawn uniformly within the same arrays (qc.edge_null_draws per peak)."
      - "Text: Kolmogorov-Smirnov statistic D (largest gap between the curves) and its BH-adjusted q-value."
    abbreviations:
      KS: "Kolmogorov-Smirnov test comparing two distributions"
      ECDF: "empirical cumulative distribution function"

  mod01:
    title: "Motif effects within repeat classes"
    meaning: >
      Binding is log2(IP / input) in every bin of the genome. Within each sample, binding was regressed on the motif
      terms of every model family, comparing only bins of the same repeat class, GC and mappability (Level 1); the
      per-sample effects were combined across samples by random-effects meta-analysis (Level 2) and shrunk towards zero
      in proportion to their uncertainty (Level 3). A point right of zero means bins with more sites of the family are
      bound more than similar bins with fewer sites. These are associations, not evidence of sequence recognition.
    axes:
      - "Panels: repeat classes with a per-class fit (CenSat class, RepeatMasker class, or none)."
      - "y-axis: motif families with the largest shrunk effect in any class."
      - "x-axis: shrunk effect on binding per unit of the motif term (binding_models.count_transform), with its 95% interval."
  mod02:
    title: "Motif effects before and after the repeat-class comparison"
    meaning: >
      The same regression pooled over repeat classes, once ignoring repeat class (orange) and once comparing bins only
      within their repeat class (blue). A family whose effect shrinks to near zero once repeat class is accounted for owes
      its apparent effect to the repeats it sits in (typically bound satellites); one that keeps its effect is associated
      with binding beyond its repeat context. GC and mappability are matched in both.
    axes:
      - "y-axis: motif families with the largest effect when repeat class is ignored."
      - "x-axis: shrunk effect on binding per unit of the motif term; the line joins the two estimates."
  mod03:
    title: "Condition effects on motif effects"
    meaning: >
      Level 2 meta-regression of the per-sample motif effects on the model terms (binding_models.terms; by default every
      condition level the design check marks estimable). Each tile is the change in the motif effect in samples with that
      level, relative to the reference level, after shrinkage. Condition effects rest on the number of samples, not bins.
    axes:
      - "x-axis: model terms (covariate__level, relative to the reference level in tables/design_estimability.tsv)."
      - "y-axis: motif families with the largest shrunk change."
      - "Colour: shrunk change in the motif effect (red = stronger with that level, blue = weaker)."
  mod04:
    title: "Held-out satellite arrays"
    meaning: >
      In each CenSat class with enough arrays, arrays were split into folds; the per-class model fitted on the other
      folds predicted binding in the held-out arrays with all families and with each family left out. Positive values mean
      the family improves predictions on arrays the model never saw; values near zero mean it adds nothing out of sample.
    axes:
      - "x-axis: CenSat classes with at least binding_models.validation_folds arrays."
      - "y-axis: motif families."
      - "Colour: mean over samples of (MSE without the family - MSE with it) / MSE with all families."
    abbreviations:
      MSE: "mean squared error of predicted binding"
  mod05:
    title: "Motif effects: all reads vs uniquely placed reads"
    meaning: >
      Overall motif effects estimated from all reads and from uniquely placed reads only. Effects that agree do not depend
      on how multi-mapping reads were assigned to repeats; deep inside low-mappability satellites the unique-read version
      has little or no data.
    axes:
      - "Panels: repeat classes."
      - "x-axis: overall effect from all reads; y-axis: from uniquely placed reads. Dashed line: equal effects."
  mod06:
    title: "Similarity of genome-wide binding between samples"
    meaning: >
      Pearson correlation of bin-level binding between every pair of samples, divided by the geometric mean of the two
      samples' ceilings (split-half reliability of each sample, stepped up to full depth), separately for CenSat bins and
      all other bins. A scaled similarity near 1 means two samples agree as well as each agrees with itself.
    axes:
      - "Rows and columns: samples. Colour: scaled similarity. Colour bars: sample metadata."
  mod07:
    title: "Similarity of binding explained by each condition"
    meaning: >
      Share of the between-sample variation in binding (distance = 1 - scaled similarity) that lies between the levels of
      each covariate, from one-way permutation tests; the marginal PERMANOVA of the model terms is in
      tables/models_similarity_permanova.tsv.
    axes:
      - "x-axis: covariates. y-axis: one-way R2. Colours: CenSat bins and other bins."
    abbreviations:
      PERMANOVA: "permutational analysis of variance on a distance matrix"

