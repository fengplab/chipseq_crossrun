# ---------------------------------------------------------------------------------------------
# chipseq_crossrun configuration
# All paths may be absolute or relative to the directory you launch run_all.sh from.
# ---------------------------------------------------------------------------------------------

manifest: config/manifest_human_narrow_allo.tsv          # one row per IP sample -- human samples only
outdir: crossrun_out_human_narrow_allo          # everything is written here (work/, tables/, figures/)
threads: 16

# Pipeline defaults used to locate files when the manifest does not override them
default_aligner: bowtie2        # bwa | bowtie2 | chromap | star
default_peak_type: narrow_peak  # narrow_peak | broad_peak

# ---- Genome (every sample in one analysis must share this build) ----------------------------
genome_build: T2T-CHM13v2.0
genome_fasta: /home/bradlem9/isilon/cGAS/motif_analysis/data/ref/Human-T2T/GCA_009914755.4_T2T-CHM13v2.0_genomic.fna          # must have a .fai next to it
chrom_sizes: /home/bradlem9/isilon/cGAS/motif_analysis/results/narrow_allo/A549FlagcGAS_IAV_IP-M2/genome/GCA_009914755.4_T2T-CHM13v2.0_genomic.with_virus_panel.fa.sizes     # <outdir>/genome/*.sizes from any pipeline run of this species
# Chromosome names: all outputs use UCSC-style chr1..chr22, chrX, chrY, chrM. Inputs in other
# conventions (e.g. T2T RefSeq NC_060925.1 or GenBank CP068277.2) are converted automatically using the
# FASTA headers and a built-in T2T-CHM13v2.0 table. For other assemblies, or to override, list alias
# files here: NCBI *_assembly_report.txt, UCSC chromAlias.txt, or any TSV with a chr-style column.
chrom_alias: [/home/bradlem9/isilon/cGAS/motif_analysis/data/ref/Human-T2T/hs1.chromAlias.txt]
# Non-host and excluded contigs. Reads aligned to viral genomes (a separate FASTA, combined with the host genome
# for alignment) are counted per sample for Figure P5, the pies and the coverage plots, but never enter the
# peak-based analyses. host_exclude lists host contigs (e.g. chrM) kept out of every peak-based analysis
# (shuffles, motif discovery backgrounds, regions, models) while still being counted in the read breakdowns.
contigs:
  viral_fasta: /home/bradlem9/isilon/cGAS/motif_analysis/data/ref/viruses/virus_panel.fa              # optional FASTA of the viral genomes (lengths are otherwise read from the BAM headers)
  viral:                         # display name: contig name (accession) in the BAMs
    HSV-1: NC_001806.2           # herpes simplex virus 1, strain 17
    KSHV: NC_009333.1            # Kaposi's sarcoma-associated herpesvirus (HHV-8), strain GK18
    ADV: AC_000008.1             # human adenovirus 5
  host_exclude: [chrM]
  viral_mapq: 0                 # minimum MAPQ for reads on the viral genomes (host contigs are not MAPQ-filtered);
                                 # see tables/qc07_viral_mapq_summary to choose it
# Where peaks can land in the null model. Use the pipeline's *.include_regions.bed (blacklist
# already removed) and/or an exclusion BED (blacklist + assembly gaps + low mappability).
include_bed: null
exclude_bed: /home/bradlem9/isilon/cGAS/motif_analysis/data/ref/Human-T2T/rdnaModel.bed

# ---- Feature annotations -----------------------------------------------------------------------
# Accepted: the pipeline's genome/annotation/{repeatmasker,censat}.bb, a BED6+2 (class in col 7,
# family in col 8), a UCSC rmsk.txt(.gz) table, or a plain BED4 whose name encodes the class.
repeatmasker: /home/bradlem9/isilon/cGAS/motif_analysis/data/ref/Human-T2T/chm13v2.0_rmsk.bb
censat: /home/bradlem9/isilon/cGAS/motif_analysis/data/ref/Human-T2T/censat.bb
genes_bed: null                  # optional BED6 of genes (name in col 4) for nearest-gene labels

# ---- Motif databases -----------------------------------------------------------------------------
known_motif_dbs:                 # MEME format; used identically for every sample
  - /home/bradlem9/isilon/cGAS/motif_analysis/data/ref/motifs/JASPAR2026.meme
  - /home/bradlem9/isilon/cGAS/motif_analysis/data/ref/motifs/H12CORE_meme_format.meme
tf_class_table: /home/bradlem9/isilon/cGAS/motif_analysis/data/ref/motifs/tf_classes.tsv             # optional TSV: motif_id, tf_class, tf_family (see bin/fetch_jaspar_classes.py)
repeat_consensus_fasta: /home/bradlem9/isilon/cGAS/motif_analysis/data/ref/motifs/Dfam_human_curated.fa     # optional FASTA of repeat consensus sequences (e.g. Dfam export)

# ---- Metadata model ------------------------------------------------------------------------------
batch_var: run_id                # pipeline run / batch; null = not used. Never part of the confounding analysis; when set, it
                                 # restricts permutations and adds run-sensitivity refits in the regression models
series_var: series_id            # identifies a time course (blank for stand-alone samples)
time_var: hpi                    # numeric time within a series
categorical_covariates: [cell_type, virus,cgas_construct]   # restricted per project scope: only these four
numeric_covariates: [hpi]
condition_vars: [cell_type, virus,cgas_construct]   # "distinct conditions" for region recurrence
upset_group_var: virus           # grouping used for the UpSet plot
covariate_labels: {virus: "Viral Agent", hpi: "Hours post-infection", cgas_construct: "cGAS construct"} # optional readable names, e.g. {hpi: "Hours post-infection", cgas_construct: "cGAS construct"}

# ---- Motif analysis ------------------------------------------------------------------------------
# MEME Suite tools run as-is from PATH, or behind a prefix, e.g. the container the pipeline used:
#   meme_prefix: "apptainer exec /path/to/memesuite_5.5.9.sif"
meme_prefix: ""
motifs:
  # Motif discovery (step 02):
  #   control_bam - rerun XSTREME per sample with control sequences taken from that sample's control
  #                 (input/IgG) alignment: windows centred on control-library fragments, matched to the
  #                 peak windows in number and width. Samples without a control fall back to shuffled.
  #   pipeline    - reuse the pipeline's XSTREME results (shuffled-sequence controls)
  discovery: control_bam
  # How discovery runs:
  #   text    - STREME, MEME and SEA in text-only mode (no HTML report, so it works even when the MEME
  #             install cannot write HTML). Order-2 background from the control sequences; STREME and MEME
  #             (zoops, differential enrichment) against the controls; SEA scores every motif.
  #   xstreme - XSTREME itself (needs a MEME install that can write HTML reports)  
  discovery_engine: text
  control_ratio: 1               # control sequences per peak sequence
  xstreme_maxw: 30             # max motif width when the pipeline's pipeline_maxw.txt is not available
  min_width: 8                   # minimum motif width (bp) for discovery (STREME/MEME/XSTREME --minw); shorter motifs from the
                                 # pipeline's own XSTREME are also dropped. Changing it reruns discovery (step 02) and everything after.
                                 # Short motifs (6-7 bp) often cannot reach fimo_thresh at all (see table08 'scannable').
  denovo_max_evalue: 0.05        # significance gate for de novo motifs, one setting for STREME and MEME alike:
                                 # a motif enters the motif families only when SEA's E-value for it, against that
                                 # sample's control sequences, is at or below this. SEA scores both programs'
                                 # motifs in one run with one test, so the number means the same for both (their
                                 # own E-values are computed differently and are not comparable). A motif SEA did
                                 # not report counts as not significant. null = no gate (every reported motif is
                                 # kept). Applied when step 02 collects the results, so changing it does not
                                 # rerun discovery; tables/xstreme_motifs.tsv keeps every motif with its
                                 # sea_evalue and passes_denovo_evalue. Note SEA scores the same sequences
                                 # discovery searched, so this is a floor on quality, not a held-out test.
  meme_nmotifs: 50  # text engine: motifs MEME searches for (XSTREME's default is also 5)
  meme_searchsize: 0  # Maximum search size for looking for motif enrichment in peak bases. Set to 0 to never randomly sample
  streme_extra_args: ""          # text engine: appended to STREME
  meme_extra_args: "-mod anr -evt 0.05"            # text engine: appended to MEME (e.g. "-p 4" for parallel MEME)
  xstreme_extra_args: ""         # xstreme engine: appended to XSTREME
  seq_mode: summit                 # peak = whole peak (as the pipeline does) | summit = summit +/- flank
                                 # (broadPeak files have no summit: summit mode then uses the midpoint, so use peak for broad peaks)
  summit_flank: 100
  fimo_thresh: 1.0e-4
  family_evalue: 0.2            # Tomtom E-value defining "similar" discovered motifs
  family_cut_height: 0.3         # hclust (average linkage) cut on d = min(1, E / family_evalue)
  family_cooccupancy_min: 0.7    # second family stage (null = Tomtom only): merge Tomtom families whose sites coincide,
                                 # average linkage, while the average pair similarity is >= this. Check on a finished run:
                                 #   python3 bin/cooccupancy.py assess --crossrun <outdir> --show 0.7
  family_cooccupancy_overlap: 0.5  # two sites coincide when they overlap by this share of the shorter motif
  family_cooccupancy_containment: 0.85  # pair similarity = containment (share of the nested family's sites on the other's)
                                 # when containment >= this and mutual >= family_cooccupancy_floor; otherwise mutual
                                 # (= the smaller of the two shares). null = mutual only.
  family_cooccupancy_floor: 0.5
  known_evalue: 0.05             # Tomtom E-value for a known-motif match
  sea_qvalue: 0.05               # SEA q-value for "known motif enriched"
  sea_control: shuffled          # shuffled (XSTREME-like) | genomic (shuffled peak locations)
  # A family is "detected" in a sample when it is enriched (q < detect_qvalue and fold >= detect_min_enrichment)
  # against the chosen reference:
  #   genomic  - the same windows relocated at random in the genome (Fisher test on % of windows with a site)
  #   shuffled - shuffled copies of the sample's own peaks, as XSTREME used to discover the motifs (SEA)
  #   both / either - require both references, or accept either
  detect_against: genomic
  detect_qvalue: 0.05
  detect_min_enrichment: 1.5
  q5_min_denovo_samples: 2       # families found de novo in >= this many samples enter the Q5 models even if never detected
  q5_max_motif_features: 50      # at most this many motif families (most variable) enter the Q5 models
  spacing_max: 400               # max inter-site spacing recorded (bp)
  repeat_min_sites_per_peak: 3   # repeat-likeness flag thresholds
  repeat_min_periodic_frac: 0.3
  repeat_min_pct_sites_in_repeats: 50

# ---- Repeat / satellite enrichment --------------------------------------------------------------
repeats:
  null_model: gc_matched            # uniform | gc_matched
  gc_candidates: 10              # gc_matched: relocations tried per peak per iteration
  n_shuffles: 1000               # empirical p floor = 1/(n+1); use >= 1000 for final figures
  same_chrom: true               # bedtools shuffle -chrom
  overlap_rule: midpoint         # midpoint (peak midpoint inside feature) | fraction
  overlap_fraction: 0.5          # used when overlap_rule = fraction
  pseudocount: 1
  min_observed: 5                # labels shown in heatmaps need >= this many peaks in some sample
  reads_in_repeats: true        # featureCounts ChIP vs control read fractions per class (slow)

# ---- Quality control (report section "Quality control") -----------------------------------------
qc:
  enabled: true
  mappability_k: 150             # k-mer length = insert size used for single-copy k-mer mappability
  mappability_bedgraph: null     # reuse an existing GenMap/Umap k-mer bedGraph (1 = single-copy k-mer) instead of running GenMap
  genmap_index: null             # reuse an existing GenMap index directory (built under work/qc otherwise)
  write_mappability_track: true  # write per-base mappability as a bedGraph (work/qc/) for genome browsers
  peak_score: score             # signal (fold enrichment, col 7) | qvalue (-log10 q, col 9) | pvalue (col 8) | score (col 5)
  insert_max: 1000               # ignore fragments longer than this (bp)
  insert_genome_fraction: 0.01   # fraction of all fragments sampled for the "outside CenSat" reference
  shape_min_reads: 10            # peaks need at least this many reads for the strand/stacking QC
  edge_null_draws: 20            # random positions per peak for the array-edge null
  edge_min_peaks: 10             # CenSat classes need at least this many peak summits for the array-edge QC

# ---- Binding models: bin table (step 16) and models (step 17) ------------------------------------
# The genome is tiled into fixed bins; binding = log2(IP / input) of mean per-base fragment coverage per bin.
# The bin size comes from a standalone tuning run (tune/run_tuning.sh), done once and reused by every later run.
bins:
  size: 150                     # bp; null = take chosen_size from tuning_record
  tuning_record: null            # <tuning outdir>/bin_size.tsv written by tune/run_tuning.sh
  unique_mapq: 255               # reads at or above this MAPQ form the unique-only arm (Bowtie2 -k mode: 255 = placed uniquely)
  insert_max: 2000               # fragments longer than this are ignored (bp)
  mappability_bedgraph: null     # per-base mappability; default <outdir>/work/qc/mappability_k<k>.bedgraph.gz (step 14)
  drift_check: true              # compare signal retained at the chosen size with the tuning floor on one chromosome
binding_models:
  enabled: true
  time_bins: [2, 6, 12]          # upper edges (units of time_var) of ordered time categories: <=2, >2-6, >6-12, >12
  # ---- model terms (Levels 2-3, similarity)
  terms: auto                    # auto = every covariate level step 17 marks estimable (tables/design_estimability.tsv);
                                 # or a list of covariates, e.g. [virus, time_bin, cgas_construct]: their estimable levels.
                                 # A covariate with no estimable level is refused with step 17's reason.
  # ---- Level 1 (step 18): binding ~ motif terms | strata, one fit per sample and read version
  arms: [all, uniq]              # read versions: all reads, uniquely placed reads (MAPQ >= bins.unique_mapq)
  families: detected             # detected (in >= 1 sample, table02) | all | a list of family ids
  max_families: 50               # cap for 'detected': most samples detected, then median % of peaks with a site
  count_transform: log2p1        # motif term per bin: log2p1 = log2(1 + sites) | raw = sites | presence = sites > 0
  gc_bins: 10                    # strata: GC quantile bins (over the bins of a fit) x mappability bins
  mappability_breaks: [0.25, 0.5, 0.9]
  min_bins_per_class: 1000       # repeat classes with fewer bins get no per-class fit (they stay in the pooled fits)
  max_n_frac: 0.1                # bins with a larger fraction of N are left out
  input_min_quantile: 0.01       # bins whose input (per million fragments) is below this quantile of non-zero input are left out
  nonarray_block: 1000000        # SE clusters: a satellite array, or a block of this many bp outside arrays
  min_clusters: 10               # a fit with fewer clusters gets heteroskedasticity-robust SEs instead of clustered ones
  level1_mode: slurm             # slurm = step 18 prints the sbatch command for models/level1.sbatch | inline = run in step 18
  level1_threads: 8              # fixest threads per Level 1 fit (match --cpus-per-task of models/level1.sbatch)
  # ---- held-out arrays (run inside each Level 1 task)
  validation_folds: 5            # CenSat classes with at least this many arrays are split into this many folds
  validation_arms: [all]
  # ---- similarity (step 20)
  similarity_arm: all
  similarity_max_bins: 2000000   # per group (CenSat bins, other bins), sampled with seed
  permutations: 999              # PERMANOVA / one-way permutation tests
  seed: 7

# ---- Bin-size tuning (tune/run_tuning.sh; not part of run_all.sh) ---------------------------------
tuning:
  outdir: bin_tuning             # where the tuning run writes (its own setup, bins and record)
  chromosomes: [chr1, chr9, chr16, chr21]
  sizes: [60, 100, 150, 200, 250, 300, 400, 500, 750, 1000, 2000]   # candidate bin sizes; the smallest is the floor
  base: 10                       # coverage is computed once at this size and summed exactly to every candidate
  tolerance: 0.05                # largest size whose retained signal stays within this fraction of the floor
  reference_motifs: null         # optional MEME file of 3-5 motifs (e.g. families from a previous run) for the motif criterion
  drift_chromosome: chr21        # chromosome used by the drift check in later runs
  
# ---- Regions --------------------------------------------------------------------------------------
regions:
  bin_size: 25000               # hotspot bins
  top_n: 50
  input_peaks_dir: null          # optional dir of <control_id>_peaks.*Peak (see steps/optional_call_input_peaks.sh)

 # ---- Extra figures (step 19; written to <outdir>/extra/, not part of the report) ------------------
extra_plots:
  enabled: true
  coverage: true                 # extra/coverage/<sample>/<contig>_<norm>.png for every sample and contig
  coverage_norms: [raw, cpm, genome, input]
  coverage_bands: /home/bradlem9/isilon/cGAS/motif_analysis/data/ref/Human-T2T/chm13v2.0_cytobands_allchrs.bed           # optional cytoband file for an ideogram under every host chromosome
  coverage_cap: 0.999            # clip each plot's y-axis at this quantile (null = no clipping)
  pies: true                     # extra/pies/: reads and peaks per contig, per sample and pooled
  pie_group_by: [virus, cell_type, cgas_construct]               # manifest columns to pool samples by in extra pies (e.g. [virus, cell_type]); one figure per column, one pie per level
  insert_sizes: true             # extra/insert_sizes/: per-sample insert-size distributions by CenSat class (formerly Figure QC3)
